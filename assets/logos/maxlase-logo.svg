<?xml version="1.0" encoding="UTF-8"?>
<!-- MaxLase logo — Weld Solutions. Wordmark: Exo 2 Black Italic; tagline: Rajdhani (Google Fonts). -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2200 900" width="2200" height="900">
  <defs>
    <linearGradient id="steel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#23262b"></stop><stop offset="14%" stop-color="#6d747e"></stop>
      <stop offset="42%" stop-color="#e9edf2"></stop><stop offset="50%" stop-color="#ffffff"></stop>
      <stop offset="58%" stop-color="#aab1ba"></stop><stop offset="78%" stop-color="#3b4048"></stop>
      <stop offset="100%" stop-color="#101216"></stop>
    </linearGradient>
    <linearGradient id="bluechrome" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a2668"></stop><stop offset="14%" stop-color="#1f5ed2"></stop>
      <stop offset="42%" stop-color="#8fc0ff"></stop><stop offset="50%" stop-color="#eef5ff"></stop>
      <stop offset="58%" stop-color="#3f86f0"></stop><stop offset="78%" stop-color="#0d3ba6"></stop>
      <stop offset="100%" stop-color="#05123a"></stop>
    </linearGradient>
    <linearGradient id="redstreak" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ff0000" stop-opacity="0"></stop>
      <stop offset="72%" stop-color="#ff1a1a" stop-opacity="0.85"></stop>
      <stop offset="100%" stop-color="#ff3b3b" stop-opacity="1"></stop>
    </linearGradient>
    <radialGradient id="sparkglow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffe6e6" stop-opacity="1"></stop>
      <stop offset="28%" stop-color="#ff2020" stop-opacity="0.9"></stop>
      <stop offset="100%" stop-color="#ff0000" stop-opacity="0"></stop>
    </radialGradient>
    <filter id="softshadow" x="-20%" y="-20%" width="140%" height="170%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity="0.33"></feDropShadow>
    </filter>
    <filter id="sparkblur" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="5"></feGaussianBlur></filter>
  </defs>
  
  <line id="streak" x1="767.569189453125" y1="283.84000000000003" x2="1786.56396484375" y2="260" stroke="url(#redstreak)" stroke-width="7" stroke-linecap="round"></line>
  <g id="wordmark" filter="url(#softshadow)" font-family="'Exo 2'" font-weight="900" font-style="italic" font-size="380" letter-spacing="-6">
    <text x="300" y="600" fill="url(#steel)" stroke="#0a0c10" stroke-width="3" paint-order="stroke">Max</text>
    <text x="1000" y="600" fill="url(#bluechrome)" stroke="#04081c" stroke-width="3" paint-order="stroke">Lase</text>
  </g>
  <g id="spark" transform="translate(1864.56396484375,254)">
    <circle r="82" fill="url(#sparkglow)" filter="url(#sparkblur)"></circle>
    <path d="M0,-138 L16,-16 L138,0 L16,16 L0,138 L-16,16 L-138,0 L-16,-16 Z" fill="#ff1414"></path>
    <path d="M0,-66 L10,-10 L66,0 L10,10 L0,66 L-10,10 L-66,0 L-10,-10 Z" fill="#ff5252" transform="rotate(45)"></path>
    <circle r="12" fill="#ffecec"></circle>
  </g>
  <text id="tag" x="1100" y="720" text-anchor="middle" fill="#22262d" font-family="Rajdhani" font-weight="600" font-size="82" letter-spacing="20">PRECISION WELDING SYSTEMS</text>
  <line id="ruleL" stroke="#173a97" stroke-width="6" x1="300" x2="304.34375" y1="698.08" y2="698.08"></line>
  <line id="ruleR" stroke="#173a97" stroke-width="6" x1="1895.65625" x2="1858.56396484375" y1="698.08" y2="698.08"></line>
</svg>